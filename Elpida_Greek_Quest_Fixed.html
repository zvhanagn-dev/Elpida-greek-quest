<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elpida Greek Quest</title><style>body{font-family:system-ui,Arial;background:#f7f7fc;color:#222;margin:0}header{background:linear-gradient(110deg,#6a3ba9,#d64c89);color:white;padding:30px 18px;text-align:center}main{max-width:760px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #23213b12}.filters{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #ddd;background:white;border-radius:11px;padding:12px 14px;cursor:pointer;font-size:15px}button:hover{border-color:#7b4ac1}button.active{background:#6a3ba9;color:white}button.correct{background:#d4f5e4;border-color:#17825b}button.wrong{background:#ffe0e0;border-color:#d65b5b}.options{display:grid;gap:9px}.options button{text-align:left}h1{margin:0}h2{font-size:22px}.small{color:#666;font-size:14px}.feedback{margin-top:14px;font-weight:600}.score{font-weight:700;color:#63379e}footer{text-align:center;padding:25px;color:#777}</style><header><h1>🌸 Elpida's Greek Quest 🇬🇷</h1><p>Articles • Endings • Verbs • Real sentences</p></header><main><div class="card"><p class="score" id="score"></p><div class="filters" id="filters"></div><p class="small">Choose a category above, then select the correct answer. You can practise any category again!</p><button onclick="restart()">↻ Restart selected category</button></div><div id="quiz"></div></main><footer>Μπράβο, Ελπίδα! 💜</footer><script>const data=[{"cat": "Articles", "q": "___ φίλη μου είναι καλή.", "opts": ["Η", "Ο", "Το"], "a": 0, "ex": "Η φίλη is feminine."}, {"cat": "Articles", "q": "Αγαπάω ___ μπαμπά μου.", "opts": ["ο", "τον", "του"], "a": 1, "ex": "Αγαπάω + object → τον μπαμπά."}, {"cat": "Articles", "q": "Το βιβλίο ___ φίλης μου.", "opts": ["της", "την", "η"], "a": 0, "ex": "When answering “whose?” → της φίλης."}, {"cat": "Articles", "q": "Βλέπω ταινία ___ κουζίνα.", "opts": ["στο", "στην", "στον"], "a": 1, "ex": "Η κουζίνα changes to στην κουζίνα."}, {"cat": "Articles", "q": "___ παιδί είναι καλό.", "opts": ["Η", "Ο", "Το"], "a": 2, "ex": "Το παιδί = neuter."}, {"cat": "Articles", "q": "Αγαπάω ___ πειρατή.", "opts": ["τον", "του", "ο"], "a": 0, "ex": "When answering “whom?” → τον πειρατή."}, {"cat": "Articles", "q": "Το βιβλίο ___ παιδιού.", "opts": ["τον", "του", "το"], "a": 1, "ex": "When answering “whose?” → του παιδιού."}, {"cat": "Articles", "q": "Ο Χοσέ αγαπάει ___ Ζωή.", "opts": ["η", "τη", "της"], "a": 1, "ex": "When answering “whom?” → τη Ζωή."}, {"cat": "Noun & adjective endings", "q": "Η φίλ___ μου είναι καλή.", "opts": ["-ος", "-η", "-ο"], "a": 1, "ex": "Η φίλη."}, {"cat": "Noun & adjective endings", "q": "Ο μπαμπ___ μου είναι καλός.", "opts": ["-άς", "-ή", "-ό"], "a": 0, "ex": "Ο μπαμπάς."}, {"cat": "Noun & adjective endings", "q": "Αγαπάω τον πειρατ___.", "opts": ["-ής", "-ή", "-ί"], "a": 1, "ex": "Τον πειρατή."}, {"cat": "Noun & adjective endings", "q": "Το βιβλίο της μαμ___.", "opts": ["-άς", "-ά", "-ή"], "a": 0, "ex": "Της μαμάς."}, {"cat": "Noun & adjective endings", "q": "Το παιδί είναι καλ___.", "opts": ["-ός", "-ή", "-ό"], "a": 2, "ex": "Το καλό παιδί."}, {"cat": "Noun & adjective endings", "q": "Ο σκύλος είναι καλ___.", "opts": ["-ός", "-ή", "-ό"], "a": 0, "ex": "Ο καλός σκύλος."}, {"cat": "Noun & adjective endings", "q": "Η μαμά μου είναι καλ___.", "opts": ["-ός", "-ή", "-ό"], "a": 1, "ex": "Η καλή μαμά."}, {"cat": "Noun & adjective endings", "q": "___ φαγητό είναι νόστιμο.", "opts": ["Ο", "Η", "Το"], "a": 2, "ex": "Το φαγητό."}, {"cat": "Verb endings", "q": "Εγώ ___ νερό.", "opts": ["πίνω", "πίνεις", "πίνει"], "a": 0, "ex": "Εγώ πίνω."}, {"cat": "Verb endings", "q": "Εσύ ___ στις επτά.", "opts": ["ξυπνάω", "ξυπνάς", "ξυπνάει"], "a": 1, "ex": "Εσύ ξυπνάς."}, {"cat": "Verb endings", "q": "Η κοπέλα ___ ένα μήλο.", "opts": ["τρώω", "τρως", "τρώει"], "a": 2, "ex": "Η κοπέλα τρώει."}, {"cat": "Verb endings", "q": "Εμείς ___ κάθε Σάββατο.", "opts": ["χορεύουμε", "χορεύετε", "χορεύουν"], "a": 0, "ex": "Εμείς χορεύουμε."}, {"cat": "Verb endings", "q": "Αύριο αυτοί ___.", "opts": ["θα χορέψουμε", "θα χορέψουν", "χορέψαμε"], "a": 1, "ex": "Αυτοί θα χορέψουν."}, {"cat": "Verb endings", "q": "Χθες εγώ ___ ελληνικά.", "opts": ["μαθαίνω", "θα μάθω", "έμαθα"], "a": 2, "ex": "Yesterday → έμαθα."}, {"cat": "Verb endings", "q": "Αύριο εγώ ___ νερό.", "opts": ["θα πιω", "ήπια", "πίνεις"], "a": 0, "ex": "Tomorrow → θα πιω."}, {"cat": "Verb endings", "q": "Χθες εμείς ___ .", "opts": ["χορεύουμε", "χορέψαμε", "θα χορέψουμε"], "a": 1, "ex": "Yesterday → χορέψαμε."}, {"cat": "Verb endings", "q": "Εσείς ___ ελληνικά.", "opts": ["μαθαίνουμε", "μαθαίνετε", "μαθαίνουν"], "a": 1, "ex": "Εσείς μαθαίνετε."}, {"cat": "Verb endings", "q": "Η Ζωή ___ τον Χοσέ.", "opts": ["αγαπάς", "αγαπάει", "αγαπάω"], "a": 1, "ex": "Η Ζωή αγαπάει."}, {"cat": "Verb endings", "q": "Εγώ ___ την ταινία.", "opts": ["κοιτάζεις", "κοιτάζει", "κοιτάζω"], "a": 2, "ex": "Εγώ κοιτάζω."}, {"cat": "Verb endings", "q": "Η κοπέλα ___ τώρα.", "opts": ["κοιμάται", "κοιμάσαι", "κοιμάμαι"], "a": 0, "ex": "Η κοπέλα κοιμάται."}, {"cat": "Verb endings", "q": "Αύριο εγώ ___ τα μαθήματά μου.", "opts": ["έκανα", "θα κάνω", "κάνεις"], "a": 1, "ex": "Tomorrow → θα κάνω."}, {"cat": "I like / I like them", "q": "___ το αγγούρι.", "opts": ["Μου αρέσουν", "Μου αρέσει"], "a": 1, "ex": "Singular: το αγγούρι."}, {"cat": "I like / I like them", "q": "___ τα βιβλία.", "opts": ["Μου αρέσει", "Μου αρέσουν"], "a": 1, "ex": "Plural: τα βιβλία."}, {"cat": "I like / I like them", "q": "___ η μουσική.", "opts": ["Μου αρέσει", "Μου αρέσουν"], "a": 0, "ex": "Singular: η μουσική."}, {"cat": "I like / I like them", "q": "___ οι ταινίες.", "opts": ["Μου αρέσει", "Μου αρέσουν"], "a": 1, "ex": "Plural: οι ταινίες."}, {"cat": "I like / I like them", "q": "___ το σχολείο.", "opts": ["Μου αρέσουν", "Μου αρέσει"], "a": 1, "ex": "Singular: το σχολείο."}, {"cat": "I like / I like them", "q": "___ οι φίλες μου.", "opts": ["Μου αρέσει", "Μου αρέσουν"], "a": 1, "ex": "Plural: οι φίλες."}, {"cat": "Sentences", "q": "How do you say “I go to school”?", "opts": ["Κάνω το σχολείο.", "Πηγαίνω στο σχολείο.", "Είμαι το σχολείο."], "a": 1, "ex": "Πηγαίνω στο σχολείο."}, {"cat": "Sentences", "q": "How do you say “four times a week”?", "opts": ["τέσσερα φορές την εβδομάδα", "τέσσερις φορές την εβδομάδα", "τέσσερις φορά την εβδομάδα"], "a": 1, "ex": "Η φορά is feminine → τέσσερις φορές."}, {"cat": "Sentences", "q": "Choose the correct sentence.", "opts": ["Το φίλι μου είναι καλή.", "Η φίλη μου είναι καλός.", "Η φίλη μου είναι καλή."], "a": 2, "ex": "Feminine agreement."}, {"cat": "Sentences", "q": "Choose the correct sentence.", "opts": ["Η μαμά μου μαγειρεύει.", "Η μαμά μου μαγειρεύω.", "Η μαμά μου μαγειρεύεις."], "a": 0, "ex": "Η μαμά takes μαγειρεύει."}, {"cat": "Sentences", "q": "What does «καλημέρα» mean?", "opts": ["wake up", "good morning", "good night"], "a": 1, "ex": "Καλημέρα = good morning."}, {"cat": "Sentences", "q": "What does «κοιτάζω» mean?", "opts": ["look at", "sleep", "dance"], "a": 0, "ex": "Κοιτάζω = look at."}, {"cat": "Sentences", "q": "What does «κοροϊδεύω» mean?", "opts": ["cook", "make fun of", "learn"], "a": 1, "ex": "Κοροϊδεύω = make fun of."}, {"cat": "Sentences", "q": "Choose the correct sentence.", "opts": ["Βλέπω μια ταινία στην κουζίνα.", "Βλέπω μια ταινία στο κουζίνα.", "Βλέπω μια ταινία στον κουζίνα."], "a": 0, "ex": "Η κουζίνα changes to στην κουζίνα."}];
let category='All categories';
let answers={};
const cats=['All categories',...new Set(data.map(x=>x.cat))];
function shown(){return data.map((q,i)=>({...q,i})).filter(q=>category==='All categories'||q.cat===category)}
function render(){
 const qs=shown(),done=qs.filter(q=>answers[q.i]!==undefined),right=done.filter(q=>answers[q.i]===q.a).length;
 document.getElementById('score').textContent=`${right} correct / ${done.length} answered • ${qs.length} questions`;
 const filters=document.getElementById('filters');
 filters.replaceChildren();
 cats.forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.className=c===category?'active':'';b.setAttribute('aria-pressed',String(c===category));b.addEventListener('click',()=>{category=c;render();window.scrollTo({top:0,behavior:'smooth'})});filters.appendChild(b)});
 const quiz=document.getElementById('quiz');quiz.replaceChildren();
 qs.forEach((q,n)=>{
  const card=document.createElement('div');card.className='card';
  const meta=document.createElement('p');meta.className='small';meta.textContent=`${q.cat} · Question ${n+1} of ${qs.length}`;card.appendChild(meta);
  const heading=document.createElement('h2');heading.textContent=q.q;card.appendChild(heading);
  const options=document.createElement('div');options.className='options';
  q.opts.forEach((o,j)=>{const b=document.createElement('button');b.type='button';b.textContent=o;if(answers[q.i]!==undefined){if(j===q.a)b.classList.add('correct');else if(j===answers[q.i])b.classList.add('wrong')}b.addEventListener('click',()=>choose(q.i,j));options.appendChild(b)});
  card.appendChild(options);
  if(answers[q.i]!==undefined){const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=(answers[q.i]===q.a?'✅ Correct! ':'💡 Review the correct answer. ')+q.ex;card.appendChild(feedback)}
  quiz.appendChild(card);
 });
}
function choose(i,j){answers[i]=j;try{localStorage.setItem('elpidaGreekAnswers',JSON.stringify(answers))}catch(e){}render()}
function restart(){shown().forEach(q=>delete answers[q.i]);try{localStorage.setItem('elpidaGreekAnswers',JSON.stringify(answers))}catch(e){}render()}
try{answers=JSON.parse(localStorage.getItem('elpidaGreekAnswers')||'{}')}catch(e){}
render();</script></html>
